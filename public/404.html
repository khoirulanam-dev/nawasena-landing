<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Page Not Found | PT. Nawasena International Group</title>
    <link rel="icon" type="image/jpeg" href="/icon.jpeg" />
    <link
      rel="preload"
      as="font"
      href="/fonts/inter-latin.woff2"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      href="/fonts/playfair-latin.woff2"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 300 600;
        font-display: swap;
        src: url("/fonts/inter-latin.woff2") format("woff2");
      }

      @font-face {
        font-family: "Playfair Display";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("/fonts/playfair-latin.woff2") format("woff2");
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: #fff;
        font-family: "Inter", system-ui, sans-serif;
        background: #3e2723;
      }

      main {
        align-items: center;
        background:
          linear-gradient(rgba(20, 13, 10, 0.66), rgba(20, 13, 10, 0.72)),
          url("/images/hero-1.webp") center / cover;
        display: flex;
        min-height: 100vh;
        padding: 32px;
      }

      .content {
        margin: 0 auto;
        max-width: 760px;
        text-align: center;
      }

      .eyebrow {
        color: #f2d1aa;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.16em;
        margin-bottom: 18px;
        text-transform: uppercase;
      }

      h1 {
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(48px, 9vw, 96px);
        line-height: 0.95;
        margin: 0 0 24px;
      }

      p {
        color: rgba(255, 255, 255, 0.86);
        font-size: clamp(16px, 2vw, 20px);
        line-height: 1.7;
        margin: 0 auto 34px;
        max-width: 620px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        justify-content: center;
      }

      a {
        border: 1px solid rgba(255, 255, 255, 0.28);
        color: #fff;
        display: inline-flex;
        font-weight: 600;
        justify-content: center;
        min-width: 168px;
        padding: 13px 22px;
        text-decoration: none;
        transition:
          background-color 180ms ease,
          border-color 180ms ease,
          transform 180ms ease;
      }

      a:hover,
      a:focus-visible {
        background: #8d6e63;
        border-color: #8d6e63;
        outline: none;
        transform: translateY(-2px);
      }

      .secondary {
        background: rgba(255, 255, 255, 0.1);
      }

      @media (max-width: 520px) {
        main {
          padding: 24px;
        }

        .actions {
          flex-direction: column;
        }

        a {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="content" aria-labelledby="page-title">
        <div class="eyebrow">404 Not Found</div>
        <h1 id="page-title">This page is not available.</h1>
        <p>
          The page you are looking for may have moved or no longer exists.
          Return to Nawasena International Group to explore Indonesian Arabica
          green coffee beans and sample requests.
        </p>
        <div class="actions">
          <a href="/">Back to Home</a>
          <a class="secondary" href="/#request-sample">Request Sample</a>
        </div>
      </section>
    </main>
  </body>
</html>
